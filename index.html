<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TBSN Video Player</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      background: #111;
      border-bottom: 2px solid #333;
    }

    .player-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    iframe {
      width: 100%;
      max-width: 900px;
      height: 55vh;
      border-radius: 12px;
      border: none;
      background: #000;
    }

    .url-box {
      display: flex;
      justify-content: center;
      margin: 15px auto 5px;
      width: 95%;
      max-width: 600px;
    }

    .url-box input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 6px 0 0 6px;
      border: none;
      font-size: 1rem;
    }

    .url-box button {
      padding: 10px 16px;
      border: none;
      background: #ff3c00;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 0 6px 6px 0;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
      background: #111;
      border-top: 2px solid #333;
    }
  </style>

</head>

<body>
  <header>
    TBSN Video Player
  </header>

  <div class="url-box" id="url-box">
    <input id="video-url" type="text" placeholder="Paste a YouTube, Vimeo, or MP4 URL..." />
    <button onclick="loadVideo()">Play</button>
  </div>

  <div class="player-container">
    <iframe id="player" src="" allowfullscreen></iframe>
  </div>

  <footer>
    Powered by The Botosphere • video.tbsn.fun
  </footer>

  <script>
    function convertToEmbed(url) {
      if (url.includes("youtube.com/watch?v=")) {
        const id = url.split("v=")[1].split("&")[0];
        return "https://www.youtube.com/embed/" + id;
      }
      if (url.includes("youtu.be/")) {
        const id = url.split("youtu.be/")[1].split("?")[0];
        return "https://www.youtube.com/embed/" + id;
      }
      if (url.includes("vimeo.com")) {
        const id = url.split("vimeo.com/")[1];
        return "https://player.vimeo.com/video/" + id;
      }
      return url;
    }

    function loadVideo(urlOverride = null) {
      const input = urlOverride || document.getElementById("video-url").value.trim();
      const player = document.getElementById("player");

      if (!input) return;

      const embedUrl = convertToEmbed(input);
      player.src = embedUrl;
    }

    // ----- AUTO-LOAD ON PAGE OPEN -----
    const params = new URLSearchParams(window.location.search);
    const urlParam = params.get("url");

    if (urlParam) {
      // Bot passed a URL → hide box and auto-load
      document.getElementById("url-box").style.display = "none";
      loadVideo(urlParam);
    } else {
      // No URL passed → load your default placeholder video
      loadVideo("https://www.youtube.com/embed/L9NRzqm-FFw");
    }
  </script>

</body>
</html>
