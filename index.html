<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotoSphere Media Portal</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
      background: #020202;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Animated floating background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: float 18s ease-in-out infinite;
      pointer-events: none;
    }

    .orb.orange {
      width: 420px;
      height: 420px;
      background: #ff3c00;
      top: 5%;
      left: -10%;
      animation-duration: 24s;
    }

    .orb.blue {
      width: 380px;
      height: 380px;
      background: #0085ff;
      bottom: -15%;
      right: -15%;
      animation-duration: 28s;
    }

    @keyframes float {
      0% { transform: translate(0,0); }
      50% { transform: translate(40px, -30px); }
      100% { transform: translate(0,0); }
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 40px 0 10px;
      font-size: 2.7rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff3c00, #ffaa55, #0085ff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .tagline {
      text-align: center;
      margin-top: -14px;
      font-size: 1.05rem;
      opacity: 0.75;
      font-style: italic;
    }

    /* Glass Player Card */
    .player-wrapper {
      position: relative;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0;
      border-radius: 28px;
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 40px rgba(255,60,0,0.15), 
                  0 0 60px rgba(0,133,255,0.15);
      overflow: hidden;
    }

    /* Neon animated border */
    .player-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      padding: 3px;
      background: linear-gradient(140deg, #ff3c00, #0085ff, #ffaa55);
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: glow 6s linear infinite;
    }

    @keyframes glow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    /* LOADING SPINNER */
    #spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 6px solid rgba(255,255,255,0.15);
      border-top: 6px solid #ff3c00;
      animation: spin 0.8s linear infinite;
      z-index: 2;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 62vh;
      border: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      border-radius: 22px;
      z-index: 3;
      position: relative;
    }

    /* Custom play bar (hidden when autoplay/default loads) */
    .url-box {
      display: flex;
      justify-content: center;
      margin: 25px auto;
      width: 90%;
      max-width: 600px;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .url-box input {
      flex: 1;
      padding: 14px;
      border-radius: 14px 0 0 14px;
      border: none;
      background: rgba(255,255,255,0.10);
      color: #ffffff;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(5px);
    }

    .url-box button {
      padding: 14px 18px;
      background: linear-gradient(90deg, #ff3c00, #ffaa55);
      border: none;
      border-radius: 0 14px 14px 0;
      color: white;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.15);
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      opacity: 0.75;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- Background FX -->
  <div class="orb orange"></div>
  <div class="orb blue"></div>

  <header>BotoSphere Media Portal</header>
  <div class="tagline">Video. Bots. Everywhere.</div>

  <div class="url-box" id="url-box">
    <input id="video-url" type="text" placeholder="Paste a YouTube, Vimeo, or MP4 URL..." />
    <button onclick="manualPlay()">Play</button>
  </div>

  <div class="player-wrapper">
    <div id="spinner"></div>
    <iframe id="player" allowfullscreen></iframe>
  </div>

  <footer>Powered by The Botosphere • video.tbsn.fun</footer>

  <script>
    function convertToEmbed(url) {
      if (url.includes("youtube.com/watch?v=")) {
        const id = url.split("v=")[1].split("&")[0];
        return "https://www.youtube.com/embed/" + id + "?autoplay=1&controls=1";
      }
      if (url.includes("youtu.be/")) {
        const id = url.split("youtu.be/")[1].split("?")[0];
        return "https://www.youtube.com/embed/" + id + "?autoplay=1&controls=1";
      }
      return url + "?autoplay=1";
    }

    function loadVideo(url) {
      const iframe = document.getElementById("player");
      const spinner = document.getElementById("spinner");
      iframe.style.opacity = "0";
      spinner.style.display = "block";
      iframe.src = convertToEmbed(url);

      iframe.onload = () => {
        spinner.style.display = "none";
        iframe.style.opacity = "1";
      };
    }

    function manualPlay() {
      const input = document.getElementById("video-url").value.trim();
      if (!input) return alert("Please enter a valid video URL.");
      loadVideo(input);
    }

    const params = new URLSearchParams(window.location.search);
    const urlParam = params.get("url");

    if (urlParam) {
      document.getElementById("url-box").style.display = "none";
      loadVideo(urlParam);
    } else {
      document.getElementById("url-box").style.display = "none";
      loadVideo("https://www.youtube.com/embed/L9NRzqm-FFw?autoplay=1");
    }
  </script>

</body>
</html>
