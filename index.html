<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotoSphere Media Portal</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Arial", sans-serif;
      background-color: #0b0b0b;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 22px;
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #111, #1a1a1a);
      border-bottom: 1px solid #333;
    }

    .subtext {
      text-align: center;
      margin-top: -10px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #bbbbbb;
      font-style: italic;
    }

    .player-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    iframe {
      width: 100%;
      max-width: 950px;
      height: 58vh;
      border-radius: 12px;
      border: none;
      background: #000;
      box-shadow: 0 0 18px rgba(0,0,0,0.7);
    }

    .url-box {
      display: flex;
      justify-content: center;
      margin: 20px auto 5px;
      width: 95%;
      max-width: 600px;
    }

    .url-box input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 6px 0 0 6px;
      border: none;
      font-size: 1rem;
      background: #1d1d1d;
      color: #f0f0f0;
      border: 1px solid #333;
    }

    .url-box button {
      padding: 12px 18px;
      border: none;
      background: #ff3c00;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 0 6px 6px 0;
      border: 1px solid #ff3c00;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
      background: #111;
      border-top: 1px solid #333;
      color: #aaaaaa;
    }
  </style>
</head>

<body>

  <header>BotoSphere Media Portal</header>
  <div class="subtext">Video. Bots. Everywhere.</div>

  <div class="url-box" id="url-box">
    <input id="video-url" type="text" placeholder="Paste a YouTube, Vimeo, or MP4 URL..." />
    <button onclick="loadVideo()">Play</button>
  </div>

  <div class="player-container">
    <iframe id="player" src="" allowfullscreen></iframe>
  </div>

  <footer>Powered by The Botosphere • video.tbsn.fun</footer>

  <script>
    function convertToEmbed(url) {
      if (url.includes("youtube.com/watch?v=")) {
        const id = url.split("v=")[1].split("&")[0];
        return "https://www.youtube.com/embed/" + id;
      }
      if (url.includes("youtu.be/")) {
        const id = url.split("youtu.be/")[1].split("?")[0];
        return "https://www.youtube.com/embed/" + id;
      }
      if (url.includes("vimeo.com")) {
        const id = url.split("vimeo.com/")[1];
        return "https://player.vimeo.com/video/" + id;
      }
      return url;
    }

    function loadVideo(urlOverride = null) {
      const input = urlOverride || document.getElementById("video-url").value.trim();
      const player = document.getElementById("player");

      if (!input) return;
      const embedUrl = convertToEmbed(input);
      player.src = embedUrl;
    }

    // AUTO-LOAD LOGIC
    const params = new URLSearchParams(window.location.search);
    const urlParam = params.get("url");

    if (urlParam) {
      // Bot passed a video → hide paste box
      document.getElementById("url-box").style.display = "none";
      loadVideo(urlParam);
    } else {
      // No URL passed → load your default placeholder video + hide the paste bar
      document.getElementById("url-box").style.display = "none";
      loadVideo("https://www.youtube.com/embed/L9NRzqm-FFw");
    }
  </script>

</body>
</html>
