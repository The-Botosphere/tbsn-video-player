<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotoSphere Media Portal</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", Arial, sans-serif;
      background: radial-gradient(circle at top, #0e0e0e, #050505);
      color: #efefef;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 28px 10px 10px;
      font-size: 2.4rem;
      font-weight: 800;
      background: transparent;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: linear-gradient(to right, #ff4400, #ffaa77);
      -webkit-background-clip: text;
      color: transparent;
      margin-top: 10px;
    }

    .tagline {
      text-align: center;
      margin-top: -10px;
      margin-bottom: 25px;
      font-size: 1rem;
      font-style: italic;
      color: #bbbbbb;
      opacity: 0.9;
    }

    /* GLASS CARD PLAYER WRAPPER */
    .glass-card {
      max-width: 980px;
      margin: auto;
      width: 90%;
      padding: 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 35px rgba(0,0,0,0.6);
      position: relative;
    }

    /* SPINNER */
    #spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 6px solid rgba(255,255,255,0.1);
      border-top: 6px solid #ff3c00;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      animation: spin 0.8s linear infinite;
      z-index: 5;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 58vh;
      border-radius: 14px;
      border: none;
      background: #000;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .url-box {
      display: flex;
      justify-content: center;
      margin: 20px auto;
      width: 92%;
      max-width: 560px;
    }

    .url-box input {
      flex: 1;
      padding: 12px;
      border-radius: 8px 0 0 8px;
      border: none;
      font-size: 1rem;
      background: #1c1c1c;
      color: #efefef;
      border: 1px solid #333;
    }

    .url-box button {
      padding: 12px 16px;
      background: #ff4400;
      border: 1px solid #ff4400;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 0 8px 8px 0;
    }

    footer {
      text-align: center;
      padding: 18px;
      font-size: 0.9rem;
      color: #777;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <header>BotoSphere Media Portal</header>
  <div class="tagline">Video. Bots. Everywhere.</div>

  <div class="url-box" id="url-box">
    <input id="video-url" type="text" placeholder="Paste a YouTube, Vimeo, or MP4 URL..." />
    <button onclick="manualPlay()">Play</button>
  </div>

  <div class="glass-card">
    <div id="spinner"></div>
    <iframe id="player" allowfullscreen></iframe>
  </div>

  <footer>Powered by The Botosphere • video.tbsn.fun</footer>

  <script>
    function convertToEmbed(url) {
      if (url.includes("youtube.com/watch?v=")) {
        const id = url.split("v=")[1].split("&")[0];
        return "https://www.youtube.com/embed/" + id + "?autoplay=1&controls=1";
      }
      if (url.includes("youtu.be/")) {
        const id = url.split("youtu.be/")[1].split("?")[0];
        return "https://www.youtube.com/embed/" + id + "?autoplay=1&controls=1";
      }
      if (url.includes("vimeo.com")) {
        const id = url.split("vimeo.com/")[1];
        return "https://player.vimeo.com/video/" + id + "?autoplay=1";
      }
      return url + "?autoplay=1";
    }

    function loadVideo(url) {
      const embedUrl = convertToEmbed(url);
      const iframe = document.getElementById("player");
      const spinner = document.getElementById("spinner");

      iframe.style.opacity = "0";
      spinner.style.display = "block";
      iframe.src = embedUrl;

      iframe.onload = () => {
        spinner.style.display = "none";
        iframe.style.opacity = "1";
      };
    }

    function manualPlay() {
      const input = document.getElementById("video-url").value.trim();
      if (!input) return alert("Please enter a video URL.");
      loadVideo(input);
    }

    const params = new URLSearchParams(window.location.search);
    const urlParam = params.get("url");

    if (urlParam) {
      document.getElementById("url-box").style.display = "none";
      loadVideo(urlParam);
    } else {
      document.getElementById("url-box").style.display = "none";
      loadVideo("https://www.youtube.com/embed/L9NRzqm-FFw?autoplay=1");
    }
  </script>

</body>
</html>
