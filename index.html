<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotoSphere Media Portal</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
      background: #020202;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Animated floating background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: float 18s ease-in-out infinite;
      pointer-events: none;
    }

    .orb.orange {
      width: 420px;
      height: 420px;
      background: #ff3c00;
      top: 5%;
      left: -10%;
      animation-duration: 24s;
    }

    .orb.blue {
      width: 380px;
      height: 380px;
      background: #0085ff;
      bottom: -15%;
      right: -15%;
      animation-duration: 28s;
    }

    @keyframes float {
      0% { transform: translate(0,0); }
      50% { transform: translate(40px, -30px); }
      100% { transform: translate(0,0); }
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 40px 0 10px;
      font-size: 2.7rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff3c00, #ffaa55, #0085ff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .tagline {
      text-align: center;
      margin-top: -14px;
      font-size: 1.05rem;
      opacity: 0.75;
      font-style: italic;
    }

    /* Glass Player Card */
    .player-wrapper {
      position: relative;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0;
      border-radius: 28px;
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 40px rgba(255,60,0,0.15), 
                  0 0 60px rgba(0,133,255,0.15);
      overflow: hidden;
    }

    /* Neon animated border */
    .player-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      padding: 3px;
      background: linear-gradient(140deg, #ff3c00, #0085ff, #ffaa55);
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: glow 6s linear infinite;
    }

    @keyframes glow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

      left: 50%;
